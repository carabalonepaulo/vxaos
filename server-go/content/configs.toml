# Shared gameplay/UI configuration for the client and server.
#
# This file is the single source of truth for the [VS] Configs script. Values
# here are public: never put server secrets, database credentials or admin
# tokens in this file. Those stay in the server's config.toml.
#
# Symbol-like values are plain strings and are validated before they are
# rendered as Ruby symbols.
#
# TOML note: root-level keys (schema_version, loading_time, start_points, ...)
# must remain before the first [table]. Keys after a table header belong to
# that table.

schema_version = 1

# Deprecated by the patched loading screen: it no longer waits before sending
# the character-selection request. Kept at 0 for compatibility with old scripts.
loading_time = 0
loading_titles = ["Title1", "Title2"]
start_points = 10
title_bar_height = 20
drop_despawn_seconds = 60
drop_pickup_seconds = 10

# Each group is one teleport destination list. The first entry is the free
# destination and the remaining entries cost the configured gold.
teleports = [
  [
    { map_id = 1, x = 21, y = 12, gold = 10 },
    { map_id = 2, x = 4, y = 20, gold = 20 },
  ],
]

forbidden_names = ["adm ", "admin ", "gm ", "god ", "mod "]

