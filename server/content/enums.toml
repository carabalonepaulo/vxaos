# Shared enumerations for the VXA-OS client and server.
#
# This file is the single source of truth for the values rendered into the
# client's [VS] Enums script. Every constant has an explicit number: never
# renumber an existing value, because these numbers are part of save data and
# wire contracts. Add new values at the end of their group.
#
# The [protocol] tables describe protocol v2. They are validated against the Go
# server and the client patch by tests; they are not rendered into [VS] Enums.

